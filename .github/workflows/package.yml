name: Package
on:
  workflow_dispatch:
  push:
    tags: ["v0.3.0"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/package.py "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: RainbowHairFlow-0.3.0
          path: RainbowHairFlow-0.3.0.unitypackage
